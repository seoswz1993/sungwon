<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trips-seosungwon</title>
    <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="page">
        <header class="site-header">
            <h1>Trips-seosungwon</h1>
        </header>

        <main class="main-content">
            <section class="trip-list" aria-label="Travel list">
                <button class="container" type="button" data-trip="01">
                    <span class="number">01</span>
                    <span class="name-wrap">
                        <span class="name-item">Osaka, Japan 2016</span>
                    </span>
                </button>

                <button class="container" type="button" data-trip="02">
                    <span class="number">02</span>
                    <span class="name-wrap">
                        <span class="name-item">Europe 2016~2017</span>
                    </span>
                </button>

                <button class="container" type="button" data-trip="03">
                    <span class="number">03</span>
                    <span class="name-wrap">
                        <span class="name-item">Tokyo, Japan 2018</span>
                    </span>
                </button>

                <button class="container" type="button" data-trip="04">
                    <span class="number">04</span>
                    <span class="name-wrap">
                        <span class="name-item">Nha Trang, Vietnam 2022</span>
                    </span>
                </button>

                <button class="container" type="button" data-trip="05">
                    <span class="number">05</span>
                    <span class="name-wrap">
                        <span class="name-item">Kota Kinabalu, Malaysia 2024</span>
                    </span>
                </button>

                <button class="container has-thumb" type="button" data-trip="06">
                    <span class="number">06</span>
                    <span class="name-wrap">
                        <span class="name-item">Tokyo, Japan 2025</span>
                        <img class="hover-thumb" src="tokyo202511/t1.jpg" alt="Tokyo thumbnail">
                    </span>
                </button>

                <button class="container has-thumb" type="button" data-trip="07">
                    <span class="number">07</span>
                    <span class="name-wrap">
                        <span class="name-item">Qingdao, China 2026</span>
                        <img class="hover-thumb" src="qingdao202603/q1.jpg" alt="Qingdao thumbnail">
                    </span>
                </button>

                <button class="container" type="button" data-trip="08">
                    <span class="number">08</span>
                    <span class="name-wrap">
                        <span class="name-item">Quy Nhon, Vietnam 2026</span>
                    </span>
                </button>
            </section>

            <section class="contact-block" aria-label="Contact">
                <p>Contact</p>
                <a href="tel:01043200000">01043200000</a>
                <a href="mailto:xxxxsungwon@naver.com">xxxxsungwon@naver.com</a>
                <a href="https://instagram.com/xxxsungwoni" target="_blank" rel="noreferrer noopener">@xxxsungwoni</a>
            </section>
        </main>
    </div>

    <div class="panel-overlay" id="panelOverlay" aria-hidden="true">
        <div class="side-panel" id="sidePanel" role="dialog" aria-modal="true" aria-labelledby="panelTitle">
            <button class="close-button" id="closePanelButton" type="button" aria-label="Close panel">X</button>
            <div class="panel-content" id="panelContent"></div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
